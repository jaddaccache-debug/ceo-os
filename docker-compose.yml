services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://ceoos:ceoos@postgres:5432/ceoos
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Google OAuth client + token live outside the image.
      - ./secrets:/app/secrets
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ceoos
      POSTGRES_PASSWORD: ceoos
      POSTGRES_DB: ceoos
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceoos -d ceoos"]
      interval: 5s
      timeout: 3s
      retries: 10
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=${TZ:-UTC}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=ceoos
      - DB_POSTGRESDB_PASSWORD=ceoos
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
volumes:
  postgres_data:
  n8n_data:
